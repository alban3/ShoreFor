# Configuration file for ShoreFor_Paris2024

##############
# Study info #
##############
case:
  study: 'bar'
  # 1 for shoreline, 2 for bars
  evolution: 1

###############
# Input files #
###############

input_files:
  shoreline_file: './examples/lonely_bar_south1974-2025.nc'
  waves_file: './examples/wave_daily_buoy_shoreshop3_retroshoal.nc'

################
# Dakota setup #
################

# Option
option :
  detrend : 1 #0 if you do not want to detrend F+/F- / 1 if you want to detrend F+/F-

# Optimization
optimization:
  dakota: 1 #1 if you want to use dakota / 2 if you already know the parameters
  # If 2, set the parameters values:
  b: 0.0037 #-0.00305 +0.0055		0.00252		167
  c: 0.00632 #0.0021 
  phi: 231 #189

dakota_params:
  # b in m/days
  # c in m^1.5 days^-1 W-0.5
  # phi in days
  b_min: -0.01
  b_max: 0.01
  c_min: 0.0
  c_max: 0.1
  phi_min: 100
  phi_max: 400

#######################
# Begin and end times #
#######################

calibration:
  time_initial: '2000-02-03'
  time_final: '2006-12-09'

future:
  # Extrapolate the shoreline ? 1: yes, 2: no
  extrapolate: 2
  # initial time for the extrapolation
  begin_future_time: '2002-02-03'
  final_future_time: '2006-12-09'
